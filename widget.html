<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZCode 用量组件</title>
  <style>
    /* ============================================================
       液态玻璃样式（移植自 zcode-usage-monitor.html 原型，规范见
       zcode-ui-refactor-spec.md）。功能/布局/排版与重构前一致：
       深色为默认主题，浅色由 data-theme="light" 覆盖。
       ============================================================ */
    :root {
      /* ---- 玻璃材质（深色默认；alpha 0.34 与系统 Acrylic 叠加） ---- */
      --glass-rgb: 31, 35, 41;
      --glass-alpha: 0.34;
      --glass: rgba(var(--glass-rgb), var(--glass-alpha));
      --glass-filter: blur(26px) saturate(170%);
      --glass-strong: rgba(40, 44, 52, 0.50);
      --glass-soft: rgba(255, 255, 255, 0.05);
      --line: rgba(232, 238, 244, 0.13);
      --line-strong: rgba(232, 238, 244, 0.22);
      --bg: #0b0c11;
      --bg2: #14161d;
      --card: rgba(30, 34, 42, 0.34);
      --card2: rgba(38, 42, 51, 0.9);
      --border: rgba(255, 255, 255, 0.09);
      --border2: rgba(255, 255, 255, 0.16);

      /* ---- 文字 ---- */
      --text: #e8eaf0;
      --text2: #a9b1bf;
      --text3: #6d7481;

      /* ---- 强调与语义 ---- */
      --accent: #7c5cff;
      --accent-soft: rgba(124, 92, 255, 0.20);
      --accent-rgb: 124, 92, 255;
      --accent2: #4fd1c5;
      --accent2-soft: rgba(79, 209, 197, 0.12);
      --accent2-rgb: 79, 209, 197;
      --green: #34d399;
      --green-rgb: 52, 211, 153;
      --amber: #fbbf24;
      --amber-rgb: 251, 191, 36;
      --red: #f87171;
      --red-rgb: 248, 113, 113;
      --blue: #60a5fa;
      --blue-rgb: 96, 165, 250;

      /* ---- SVG 渐变端点（深色必须高对比双色，否则发虚） ---- */
      --grad-a: #7c5cff;
      --grad-b: #4fd1c5;
      --grad-in-a: #3b82f6;
      --grad-in-b: #a5c8ff;
      --grad-out-a: #23b5a6;
      --grad-out-b: #7ff0e2;
      --grad-label-a: #8fa0bd;
      --grad-label-b: #4fd1c5;
      --grad-low-a: #16a34a;
      --grad-low-b: #34d399;
      --grad-warn-a: #d97706;
      --grad-warn-b: #fbbf24;
      --grad-crit-a: #dc2626;
      --grad-crit-b: #f87171;

      --shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 2px 0 rgba(255, 255, 255, 0.04) inset;
    }

    :root[data-theme="light"] {
      --glass-rgb: 255, 255, 255;
      --glass-alpha: 0.24;
      --glass: rgba(var(--glass-rgb), var(--glass-alpha));
      --glass-strong: rgba(255, 255, 255, 0.48);
      --glass-soft: rgba(15, 23, 42, 0.04);
      --line: rgba(15, 23, 42, 0.07);
      --line-strong: rgba(15, 23, 42, 0.13);
      --bg: #f2f5f9;
      --bg2: #edf1f7;
      --card: rgba(255, 255, 255, 0.30);
      --card2: rgba(255, 255, 255, 0.40);
      --border: rgba(15, 23, 42, 0.08);
      --border2: rgba(15, 23, 42, 0.15);
      --text: #101722;
      --text2: #526070;
      --text3: #8a97a8;
      --accent: #7c5cff;
      --accent-soft: rgba(124, 92, 255, 0.12);
      --accent-rgb: 124, 92, 255;
      --accent2: #0d9488;
      --accent2-soft: rgba(13, 148, 136, 0.10);
      --accent2-rgb: 13, 148, 136;
      --green: #15803d;
      --green-rgb: 21, 128, 61;
      --amber: #b45309;
      --amber-rgb: 180, 83, 9;
      --red: #dc2626;
      --red-rgb: 220, 38, 38;
      --blue: #1d63d6;
      --blue-rgb: 29, 99, 214;
      /* 浅色：起点用文字深色、终点用语义色（规范 §1.4） */
      --grad-a: var(--text);
      --grad-b: var(--accent2);
      --grad-in-a: var(--text);
      --grad-in-b: var(--blue);
      --grad-out-a: var(--text);
      --grad-out-b: var(--accent2);
      --grad-label-a: var(--text2);
      --grad-label-b: var(--accent2);
      --grad-low-a: var(--text);
      --grad-low-b: var(--green);
      --grad-warn-a: var(--text);
      --grad-warn-b: var(--amber);
      --grad-crit-a: var(--text);
      --grad-crit-b: var(--red);
      --shadow: 0 24px 55px -20px rgba(23, 36, 58, 0.28), 0 2px 0 rgba(255, 255, 255, 0.75) inset;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", -apple-system, system-ui, sans-serif;
      background: transparent; /* 窗口透明，毛玻璃由系统 Acrylic 提供 */
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-size: 13px;
    }

    /* ---- 玻璃配方：半透明填充 + 独立背景层 backdrop-filter + 1px 描边 + 内高光 + 投影。
         backdrop-filter 不能直接放文字主容器（会破坏内部文字渲染，见规范坑 #3），
         移到 ::before 独立层，内容层 z-index:1。 ---- */
    .widget {
      position: relative; /* 8 方向 resize 手柄的定位上下文 */
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .widget::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      -webkit-backdrop-filter: var(--glass-filter);
      backdrop-filter: var(--glass-filter);
      pointer-events: none;
    }

    .widget>.header {
      position: relative;
      z-index: 5; /* 高于 section(1)：透明度弹层是 header 子元素，z-index 被锁在
                     header 的 stacking context 内，header 不提级弹层会被 section 盖住 */
    }

    .widget>.section {
      position: relative;
      z-index: 1;
    }

    /* ---- header / drag handle ---- */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 14px 11px;
      cursor: grab;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.10), transparent 55%);
    }

    .header:active {
      cursor: grabbing;
    }

    .logo {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(var(--accent-rgb), 0.35);
      flex-shrink: 0;
      cursor: pointer;
    }

    .header .titles {
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header .sub {
      font-size: 10.5px;
      color: var(--text3);
      margin-top: 1px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
    }

    .dot.live {
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(var(--green-rgb), 0.55);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(var(--green-rgb), 0.55);
      }

      70% {
        box-shadow: 0 0 0 7px rgba(var(--green-rgb), 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(var(--green-rgb), 0);
      }
    }

    .clock {
      font-size: 11px;
      color: var(--text2);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* 头部圆形按钮：折叠 / 主题 / 透明度 / 关闭 */
    .close-btn,
    .collapse-btn,
    .theme-btn,
    .opacity-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: rgba(var(--accent-rgb), 0.08);
      color: var(--text2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0;
    }

    .close-btn {
      font-size: 11px;
      line-height: 1;
    }

    .close-btn:hover {
      background: var(--red);
      color: #fff;
    }

    .collapse-btn:hover,
    .theme-btn:hover,
    .opacity-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .collapse-btn svg {
      width: 9px;
      height: 9px;
    }

    .theme-btn svg,
    .opacity-btn svg {
      width: 12px;
      height: 12px;
    }

    .theme-btn .icon-moon {
      display: none;
    }

    /* 主题切换按钮暂时隐藏（用户要求；逻辑保留，需要时放开即可） */
    .theme-btn {
      display: none;
    }

    /* 透明度按钮暂时隐藏（用户要求；setOpacity 桥与记忆逻辑保留，需要时放开即可） */
    .opacity-btn {
      display: none;
    }

    /* ---- 透明度弹层（挂在 opacity-btn 下，点击展开） ---- */
    .opacity-btn {
      position: relative;
    }

    .opacity-pop {
      position: absolute;
      top: calc(100% + 6px);
      right: -6px;
      z-index: 80;
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 158px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--card2);
      border: 1px solid var(--border2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .opacity-pop.open {
      display: flex;
    }

    .opacity-pop .op-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      color: var(--text3);
    }

    .opacity-pop .op-val {
      font-size: 11px;
      font-weight: 650;
      color: var(--text2);
      font-variant-numeric: tabular-nums;
    }

    .opacity-pop input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent2), var(--accent2) var(--op-fill, 100%),
          rgba(255, 255, 255, 0.12) var(--op-fill, 100%));
    }

    .opacity-pop input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    /* ---- collapsed (icon) state ---- */
    /* 折叠态窗口缩到 48x48。透明窗口下窗口四角是 WebView2 方形客户区，CSS 圆角
       裁不掉会露黑边。解法:折叠态 .widget 与 .logo 都用方形(border-radius:0)，
       让渐变图标精确填满 48x48 方形窗口，四角是图标内容而非黑边。
       （Win11 系统级 DWM 圆角/SetWindowRgn 兜底裁切，双保险。） */
    .widget.collapsed {
      border-radius: 0;
      border: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    .widget.collapsed .titles,
    .widget.collapsed .clock,
    .widget.collapsed .collapse-btn,
    .widget.collapsed .theme-btn,
    .widget.collapsed .opacity-btn,
    .widget.collapsed .close-btn,
    .widget.collapsed .section,
    .widget.collapsed .resize-handle {
      display: none;
    }

    .widget.collapsed .header {
      justify-content: center;
      align-items: center;
      padding: 0;
      flex: 1;
      border-bottom: none;
      background: none;
    }

    .widget.collapsed .logo {
      width: 48px;
      height: 48px;
      font-size: 22px;
      border-radius: 0;
      cursor: pointer;
      box-shadow: none;
      transition: transform .15s;
    }

    .widget.collapsed .logo:hover {
      transform: scale(1.06);
    }

    /* ---- 8 方向自定义 resize 手柄（frameless + resizable=False，前端自实现） ---- */
    .resize-handle {
      position: absolute;
      z-index: 60;
      border-radius: 4px;
      opacity: 0;
      transition: opacity .12s ease;
    }

    .widget:hover .resize-handle {
      opacity: 0.30;
    }

    .resize-handle:hover {
      opacity: 1;
      background: rgba(var(--accent-rgb), 0.32);
    }

    .rh-n {
      top: 2px;
      left: 50%;
      width: 46px;
      height: 6px;
      transform: translateX(-50%);
      cursor: ns-resize;
    }

    .rh-s {
      bottom: 2px;
      left: 50%;
      width: 46px;
      height: 6px;
      transform: translateX(-50%);
      cursor: ns-resize;
    }

    .rh-e {
      right: 2px;
      top: 50%;
      width: 6px;
      height: 46px;
      transform: translateY(-50%);
      cursor: ew-resize;
    }

    .rh-w {
      left: 2px;
      top: 50%;
      width: 6px;
      height: 46px;
      transform: translateY(-50%);
      cursor: ew-resize;
    }

    .rh-ne {
      top: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      cursor: nesw-resize;
    }

    .rh-nw {
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
    }

    .rh-se {
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
    }

    .rh-sw {
      bottom: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      cursor: nesw-resize;
    }

    .widget.collapsed .resize-handle {
      display: none;
    }

    /* ---- section ---- */
    .section {
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
    }

    .section:last-child {
      border-bottom: none;
      padding-bottom: 16px;
    }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
      gap: 8px;
    }

    .sec-title {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .sec-badge {
      font-size: 11px;
      color: var(--accent2);
      background: var(--accent2-soft);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(var(--accent2-rgb), 0.20);
      margin-left: 8px;
      white-space: nowrap;
    }

    /* provider tab 切换：火山 / opencode / DeepSeek */
    .sec-tabs {
      display: flex;
      gap: 3px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .sec-tab {
      font-size: 10.5px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--glass-soft);
      color: var(--text2);
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }

    .sec-tab:hover {
      border-color: var(--border2);
      color: var(--text);
    }

    .sec-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ---- 模型用量 ---- */
    .usage-total {
      position: relative; /* 今日累计悬浮窗的定位上下文 */
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 3px;
    }

    .usage-total .unit {
      font-size: 11px;
      color: var(--text3);
    }

    .usage-total .delta {
      font-size: 11px;
      color: var(--green);
      margin-left: auto;
      font-weight: 600;
    }

    .um-trigger .pm-pop {
      left: 0;
      right: 0;
      width: auto;
    }

    .usage-label {
      font-size: 11.5px;
      color: var(--text3);
      margin-bottom: 12px;
    }

    .usage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 11px;
    }

    .stat {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 9px;
    }

    .stat .k {
      font-size: 11px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat .v {
      font-size: 15px;
      font-weight: 650;
      margin-top: 2px;
      display: flex;
      /* SVG 无文本基线，baseline 对齐会让 small 坠到元素底边；用 center 让 tk 与数字垂直居中 */
      align-items: center;
      gap: 3px;
    }

    .stat .v small {
      font-size: 11px;
      color: var(--text3);
      font-weight: 500;
    }

    /* ---- 云端额度 ---- */
    .plan-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .plan-bucket {
      position: relative; /* .pm-pop 的定位上下文 */
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .plan-bucket-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 12px;
      gap: 6px;
    }

    .plan-bucket-head .pb-name {
      color: var(--text2);
      font-weight: 600;
    }

    .plan-bucket-head .pb-left {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .plan-bucket-head .pb-val {
      font-variant-numeric: tabular-nums;
      color: var(--text);
      white-space: nowrap;
    }

    .plan-bucket-head .pb-val small {
      color: var(--text3);
      font-size: 11px;
      margin-left: 3px;
    }

    .plan-bar {
      height: 5px;
      border-radius: 4px;
      background: var(--glass-soft);
      overflow: hidden;
    }

    .plan-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width .6s ease;
    }

    .plan-bar-fill.ok {
      background: linear-gradient(90deg, var(--accent2), var(--green));
    }

    .plan-bar-fill.warn {
      background: linear-gradient(90deg, var(--amber), #fb923c);
    }

    .plan-bar-fill.crit {
      background: linear-gradient(90deg, var(--red), #fb7185);
    }

    .plan-bucket-foot {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text3);
      font-variant-numeric: tabular-nums;
    }

    .plan-note,
    .ds-note {
      font-size: 11px;
      color: var(--text3);
      margin-top: 6px;
    }

    .ds-balance {
      display: flex;
      /* SVG 无文本基线，baseline 会让 label 基线坠到 svg 底边、余额数字视觉上移；
         改 center 让 label 与数字垂直居中（与 .stat .v 同处理） */
      align-items: center;
      gap: 7px;
      margin-bottom: 11px;
    }

    .ds-bal-label {
      font-size: 11.5px;
      color: var(--text3);
    }

    .ds-bal-sub {
      font-size: 11px;
      color: var(--text3);
      margin-left: auto;
    }

    /* ---- SVG 渐变数字（全部数字渐变；仅大字按档位切换颜色，其余固定单色） ---- */
    .gnum {
      display: inline-block;
      vertical-align: -0.3em;
      line-height: 1;
      overflow: visible;
    }

    .gnum text {
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", -apple-system, system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .gnum-lg {
      height: 34px;
    }

    .gnum-lg text {
      font-size: 27px;
      font-weight: 720;
    }

    .gnum-md {
      height: 19px;
    }

    .gnum-md text {
      font-size: 15px;
      font-weight: 650;
    }

    .gnum-sm {
      height: 15px;
    }

    .gnum-sm text {
      font-size: 11.5px;
      font-weight: 600;
    }

    .gnum-bal {
      height: 28px;
    }

    .gnum-bal text {
      font-size: 22px;
      font-weight: 720;
    }

    .gnum-pb {
      height: 16px;
    }

    .gnum-pb text {
      font-size: 12px;
      font-weight: 700;
    }

    #g-base stop:first-child {
      stop-color: var(--grad-a);
    }

    #g-base stop:last-child {
      stop-color: var(--grad-b);
    }

    #g-in stop:first-child {
      stop-color: var(--grad-in-a);
    }

    #g-in stop:last-child {
      stop-color: var(--grad-in-b);
    }

    #g-out stop:first-child {
      stop-color: var(--grad-out-a);
    }

    #g-out stop:last-child {
      stop-color: var(--grad-out-b);
    }

    #g-label stop:first-child {
      stop-color: var(--grad-label-a);
    }

    #g-label stop:last-child {
      stop-color: var(--grad-label-b);
    }

    #g-low stop:first-child {
      stop-color: var(--grad-low-a);
    }

    #g-low stop:last-child {
      stop-color: var(--grad-low-b);
    }

    #g-warn stop:first-child {
      stop-color: var(--grad-warn-a);
    }

    #g-warn stop:last-child {
      stop-color: var(--grad-warn-b);
    }

    #g-crit stop:first-child {
      stop-color: var(--grad-crit-a);
    }

    #g-crit stop:last-child {
      stop-color: var(--grad-crit-b);
    }

    /* ---- 分模型明细悬浮 ---- */
    .pm-trigger {
      cursor: help;
      display: inline-flex;
      align-items: baseline;
    }

    .pm-trigger .pm-icon {
      font-size: 13px;
      color: var(--text3);
      margin-left: 4px;
    }

    .pm-trigger .pm-total {
      font-size: 12px;
      color: var(--text2);
      font-variant-numeric: tabular-nums;
      margin-left: 6px;
    }

    .pm-pop {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--card2);
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      font-variant-numeric: tabular-nums;
    }

    .pm-trigger:hover .pm-pop,
    .pm-trigger:focus-within .pm-pop {
      display: flex;
    }

    .pm-pop .pm-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      font-size: 12px;
      color: var(--text3);
      white-space: nowrap;
    }

    .pm-pop .pm-row .pm-name {
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pm-pop .pm-hint {
      font-size: 12px;
      color: var(--amber);
      line-height: 1.4;
      white-space: normal;
    }

    /* ---- 任务列表 ---- */
    .section.tasks-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .task-list {
      flex: 1 1 auto;
      max-height: none;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 0 2px;
      padding-right: 4px;
    }

    .task-list::-webkit-scrollbar {
      width: 4px;
    }

    .task-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), 0.25);
      border-radius: 2px;
    }

    .task-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      cursor: pointer;
      margin-bottom: 7px;
      transition: border-color .15s, background .15s;
    }

    .task-card:hover {
      border-color: rgba(var(--accent-rgb), 0.55);
      background: var(--accent-soft);
    }

    .task-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }

    .status-pill::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .status-pill.running {
      background: rgba(var(--green-rgb), 0.13);
      color: var(--green);
    }

    .status-pill.running::before {
      background: var(--green);
      animation: blink 1.1s infinite;
    }

    .status-pill.completed {
      background: rgba(var(--blue-rgb), 0.12);
      color: var(--blue);
    }

    .status-pill.completed::before {
      background: var(--blue);
    }

    .status-pill.idle,
    .status-pill.queued {
      background: rgba(var(--amber-rgb), 0.12);
      color: var(--amber);
    }

    .status-pill.idle::before,
    .status-pill.queued::before {
      background: var(--amber);
    }

    .status-pill.error,
    .status-pill.failed {
      background: rgba(var(--red-rgb), 0.12);
      color: var(--red);
    }

    .status-pill.error::before,
    .status-pill.failed::before {
      background: var(--red);
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    .mode-tag {
      font-size: 11px;
      color: var(--text2);
      background: var(--glass-soft);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .task-title {
      font-size: 12.5px;
      font-weight: 620;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      display: flex;
      gap: 4px 9px;
      margin-top: 5px;
      font-size: 11px;
      color: var(--text3);
    }

    .task-meta .m {
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }

    .task-meta .m-text {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .empty {
      color: var(--text3);
      font-size: 11px;
      text-align: center;
      padding: 8px 0;
    }

    /* loading */
    .loading {
      padding: 40px 0;
      text-align: center;
      color: var(--text3);
      font-size: 12px;
    }

    .loading .spinner {
      display: inline-block;
      margin-bottom: 8px;
    }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(var(--accent-rgb), 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- 隐藏 SVG 渐变定义：数字文字用 fill="url(#g-*)" 引用，避开 background-clip: text
       在 WebView2 下 backdrop-filter/transform 共存的色块坑（规范 §5） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" /><stop offset="1" /></linearGradient>
      <linearGradient id="g-in" x1="0" y1="0" x2="1" y2="1"><stop offset="0" /><stop offset="1" /></linearGradient>

      <linearGradient id="g-label" x1="0" y1="0" x2="1" y2="1"><stop offset="0" /><stop offset="1" /></linearGradient>
      <linearGradient id="g-low" x1="0" y1="0" x2="1" y2="1"><stop offset="0" /><stop offset="1" /></linearGradient>
      <linearGradient id="g-warn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" /><stop offset="1" /></linearGradient>
      <linearGradient id="g-crit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" /><stop offset="1" /></linearGradient>
    </defs>

  <div class="widget" id="widget">

        </svg>

           div，浏览器解析会把 pop 踢出按钮导致点击区域错位、弹层拖拽即关 -->

    <!-- 8 方向 resize 手柄（frameless + resizable=False，前端自实现拖拽改尺寸，见 JS 逻辑） -->

          </div>

          </div>

    <!-- task list -->
    <div class="section tasks-section">
      <div class="sec-head">
        <div class="sec-title">任务列表</div>

      </div>
      <div id="taskArea" class="task-list">

          <div class="spinner"></div><br><span id="initMsg">正在连接 ZCode…</span>
        </div>

  <script>
    let api = null;
    let refreshTimer = null;
    let started = false;
    // 防堆积：上一次 status() 未返回时跳过本次轮询。pywebview 5.4 的 JS 桥每次
    // 调用都新建 Python 线程并行执行（util.py:js_bridge_call），前端 setInterval
    // 1.5s 不等上次返回就会堆积大量并发线程，长时间空闲后火山调用阻塞会让线程
    // 雪崩，UI 长时间无响应。串行锁确保任一时刻只有一个 status() 在飞。
    let refreshInFlight = false;
    // 容错计数：单次超时/失败不立即显示"重连中"，连续 FAIL_THRESHOLD 次才切。
    // 避免网络抖动造成状态频繁闪烁。成功一次即清零。
    let failCount = 0;
    const FAIL_THRESHOLD = 3;
    // 单次 status() 超时上限。pywebview JS 桥本身无超时机制（_checkValue 是 1ms
    // setInterval 永久轮询），必须前端用 Promise.race 自保，避免火山调用卡死时
    // Promise 永久 pending、refresh 永远停在这一帧。
    const STATUS_TIMEOUT_MS = 5000;
    // 是否已完成首次成功渲染。失败时若已渲染过，保留上次数据不动，避免界面
    // 残留 #initStatus 的"已连接，读取数据…"或被清空。
    let firstRenderDone = false;
    // 当前云端额度 tab：'volc' / 'opencode' / 'deepseek'。默认火山。
    let _provider = 'volc';

    const fmt = (n) => {
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return String(n);
    };
    const fmtFull = (n) => n.toLocaleString('en-US');

    /* ---- SVG 渐变数字（规范 §5） ---- */
    const NS = 'http://www.w3.org/2000/svg';
    const GY = { 'gnum-lg': 26, 'gnum-md': 14, 'gnum-sm': 11, 'gnum-bal': 21, 'gnum-pb': 11 };
    const FS = { 'gnum-lg': 27, 'gnum-md': 15, 'gnum-sm': 11.5, 'gnum-bal': 22, 'gnum-pb': 12 };

    // 造一个 SVG 渐变数字。set() 更新文本并重测宽；display:none 的容器（如未激活
    // 的 provider tab）里 getComputedTextLength() 返回 0，用估算宽度占位，切到该
    // 视图后统一 remeasure()（规范坑 #5）。
    function gradText(cls, gradId) {
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'gnum ' + cls);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('y', GY[cls]);
      t.setAttribute('fill', 'url(#' + gradId + ')');
      svg.appendChild(t);
      let last = '';
      function set(v) {
        last = v;
        t.textContent = v;
        let w = 0;
        try { w = t.getComputedTextLength(); } catch (e) { w = 0; }
        if (!w || !isFinite(w) || w <= 1) w = String(v).length * FS[cls] * 0.62;
        svg.setAttribute('width', Math.max(2, Math.ceil(w) + 4));
      }
      function setGrad(id) { t.setAttribute('fill', 'url(#' + id + ')'); }
      function remeasure() { if (last !== '') set(last); }
      const api = { svg, text: t, set, setGrad, remeasure };
      svg._g = api;
      return api;
    }
    // 把 <span id="..."> 替换为 SVG 渐变数字，返回 api
    function mount(sel, cls, gradId) {
      const el = document.querySelector(sel);
      if (!el) return null;
      const g = gradText(cls, gradId);
      el.replaceWith(g.svg);
      return g;
    }

    // 渲染后把 ".pb-num" 文本节点统一升级为 SVG 渐变数字（plan 百分比）
    function upgradePct(scope) {
      document.querySelectorAll(scope + ' .pb-num').forEach(el => {
        const g = gradText('gnum-pb', 'g-base');
        g.set(el.textContent);
        el.replaceWith(g.svg);
      });
    }
    // 视图内所有 SVG 渐变数字重新实测宽度（切 tab 后隐藏容器已可见，修正估算）
    function remeasureView(scope) {
      document.querySelectorAll(scope + ' .gnum').forEach(s => { if (s._g) s._g.remeasure(); });
    }

    // 大字档位：<3000万 绿 / 3000万-8000万 默认 / 8000万-1亿 琥珀 / >=1亿 红（规范 §5.3）
    function tierGrad(total) {
      if (total < 30e6) return 'g-low';
      if (total < 80e6) return 'g-base';
      if (total < 100e6) return 'g-warn';
      return 'g-crit';
    }

    function startPolling() {
      if (started) return;
      started = true;
      refresh();
      refreshTimer = setInterval(refresh, 1500);
    }

    async function refresh() {
      if (!api) return;
      // 串行锁：上一次还没返回就跳过，防止 setInterval 堆积并发 status() 调用。
      if (refreshInFlight) return;
      refreshInFlight = true;
      try {
        const s = await Promise.race([
          api.status(),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error('status timeout')), STATUS_TIMEOUT_MS)
          ),
        ]);
        renderUsage(s.usage);
        renderPlanUsage(s.planUsage);
        renderProviderUsage(s.deepseekUsage, s.deepseekBalance, {});
        renderOpencode(s.opencodeUsage);
        renderOpencodeGo(s.opencodeGo);
        renderTasks(s.recentTasks);
        renderClock(s.now);
        firstRenderDone = true;
        failCount = 0;
        document.getElementById('liveDot').className = 'dot live';
        document.getElementById('connStatus').textContent = '实时连接';
      } catch (e) {
        failCount++;
        // 连续 FAIL_THRESHOLD 次失败才显示"重连中"，单次抖动保持"实时连接"。
        if (failCount >= FAIL_THRESHOLD) {
          document.getElementById('liveDot').className = 'dot';
          document.getElementById('connStatus').textContent = '重连中…';
        }
        // 失败时保留上次成功渲染的数据，不清空界面、不重新显示 #initStatus。

      } finally {
        refreshInFlight = false;
      }
    }

    function setInit(msg) {

    function renderUsage(u) {
      // Today is the headline: reads the persistent `model_usage` table,

      const today = u.today || {};

      numObj.set(fmt(total));
      numObj.setGrad(tierGrad(total));

      G.inTokens.set(fmt(today.inputTokens || 0));
      G.outTokens.set(fmt(today.outputTokens || 0));
      G.todayTokens.set(fmt(today.totalTokens || 0));
      G.weekTokens.set(fmt((u.week || {}).totalTokens || 0));
      G.allTokens.set(fmt((u.total || {}).totalTokens || 0));
      const todayReq = today.requests || 0;
      const allReq = (u.total || {}).requests || 0;
      document.getElementById('reqBadge').textContent = todayReq + ' 次请求 / 累计 ' + allReq;

        trigger.style.display = 'none';

    function renderPlanUsage(p) {
      const section = document.getElementById('planSection');
      if (!section) return;
      // 未启用或调用失败 -> 隐藏整块，不影响本地 token 展示
      if (!p || !p.enabled) { section.style.display = 'none'; return; }
      section.style.display = '';

      // 套餐档位 badge：优先用用户配置的 tier（如 Pro），否则显示套餐类型名。
      const badge = document.getElementById('planBadge');
      const isCoding = (p.planType || 'coding') === 'coding';
      const planName = isCoding ? 'CodingPlan' : 'AgentPlan';
      badge.textContent = p.tier ? p.tier : planName;

      // 各窗口用量进度条
      // - coding: 只有百分比 -> "X% 已用 / 剩余 Y%"
      // - agent : 绝对额度   -> "used / quota" + "剩余 Z%"
      const list = document.getElementById('planList');
      const buckets = p.buckets || [];
      list.innerHTML = buckets.map(b => {
        const pct = Math.min(100, b.usedPct || 0);
        const cls = pct >= 90 ? 'crit' : (pct >= 70 ? 'warn' : 'ok');
        // 分模型 token 明细：悬浮浮层挂在「X%已用」后面，不占组件高度。
        // needsConfig=true（未配 VOLC_PLAN_START）-> 浮层提示去配置；否则列各模型。
        let popHtml = '';

            popHtml = `<span class="pm-trigger"><span class="pm-total">--</span><span class="pm-icon">⚙</span><span class="pm-pop"><span class="pm-hint">⚠ 需在 .volc.env 配置 VOLC_PLAN_START（套餐开通时间）才能统计本窗口 token 明细</span></span></span>`;
          } else if (b.models && b.models.length) {
            const totalTk = b.models.reduce((s, m) => s + (m.tokens || 0), 0);
            popHtml = `<span class="pm-trigger"><span class="pm-total">${fmt(totalTk)} tk</span><span class="pm-icon">▦</span><span class="pm-pop">` +

        const head = isCoding
          ? `<span class="pb-left"><span class="pb-name">${b.label}</span>${popHtml}</span><span class="pb-val"><span class="pb-num">${(b.usedPct || 0).toFixed(1)}%</span><small> 已用</small></span>`
          : `<span class="pb-left"><span class="pb-name">${b.label}</span></span><span class="pb-val"><span class="pb-num">${fmt(b.used)}</span><small> / ${fmt(b.quota)}</small></span>`;

        return `<div class="plan-bucket">
      <div class="plan-bucket-head">

      <div class="plan-bucket-foot"><span>${foot}</span><span>${fmtResetCountdown(b.key, b.resetMs)}</span></div>
    </div>`;
      }).join('');
      upgradePct('#planList');
      if (_provider === 'volc') remeasureView('#planList');

      const note = document.getElementById('planNote');
      note.textContent = p.error ? ('⚠ ' + p.error) : ('更新于 ' + (p.updatedAt || '').slice(11, 19) + ' · 数据来源: 火山方舟 OpenAPI');

    // 切换云端额度 tab：volc / opencode / deepseek，互斥显隐三块 body。

    // 重置倒计时：短窗口(会话/5小时)显示"X小时Y分钟后"，周/月显示"X天X小时后"。
    function fmtResetCountdown(key, resetMs) {
      if (!resetMs) return '';
      const diff = resetMs - Date.now();
      if (diff <= 0) return '已重置';
      const totalMin = Math.floor(diff / 60000);
      const days = Math.floor(totalMin / (60 * 24));
      const hours = Math.floor((totalMin % (60 * 24)) / 60);
      const mins = totalMin % 60;
      let parts = [];
      // coding 的 session 与 agent 的 AFPFiveHour 都是短窗口
      if (key === 'session' || key === 'AFPFiveHour') {
        if (hours > 0) parts.push(hours + '小时');
        if (mins > 0) parts.push(mins + '分钟');
      } else {
        // 周/月：天+小时
        if (days > 0) parts.push(days + '天');
        if (hours > 0) parts.push(hours + '小时');
      }
      if (!parts.length) return '即将重置';
      return parts.join('') + '后重置';
    }

    function renderTasks(tasks) {
      const area = document.getElementById('taskArea');
      if (!tasks || !tasks.length) { area.innerHTML = '<div class="empty">今天暂无任务</div>'; return; }
      // 显示今天创建 或 今天有更新（在历史任务里继续对话）的任务
      const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
      const ts = todayStart.getTime();
      const recent = tasks.filter(t => (t.createdAt || 0) >= ts || (t.updatedAt || 0) >= ts);
      if (!recent.length) { area.innerHTML = '<div class="empty">今天暂无任务</div>'; return; }
      area.innerHTML = recent.map((t, idx) => {
        const status = t.status || 'idle';
        const statusText = { running: '运行中', completed: '已完成', idle: '空闲', queued: '排队中', error: '错误', failed: '失败' }[status] || status;
        const model = (t.model || '').split('/').pop();
        const ws = (t.workspacePath || '').split(/[\\/]/).pop() || t.workspacePath || '';
        const fullWs = t.workspacePath || '';
        const ago = relativeTime(t.updatedAt);
        return `
    <div class="task-card" data-idx="${idx}" style="margin-bottom:7px">
      <div class="task-top">
        <span class="status-pill ${status}">${statusText}</span>
        ${t.mode ? `<span class="mode-tag">${t.mode}</span>` : ''}
        ${t.thoughtLevel ? `<span class="mode-tag">思考:${t.thoughtLevel}</span>` : ''}
        <span class="m" style="margin-left:auto;font-size:9.5px;color:var(--text3)">${ago}</span>
      </div>
      <div class="task-title" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</div>
      <div class="task-meta">
        ${ws ? `<span class="m" style="flex:1 1 auto" title="${escapeHtml(fullWs)}">📁 <span class="m-text">${escapeHtml(ws)}</span></span>` : ''}
        ${model ? `<span class="m" style="flex:1 1 auto" title="${escapeHtml(model)}">🤖 <span class="m-text">${escapeHtml(model)}</span></span>` : ''}
        ${(t.tokens && t.tokens.total > 0) ? `<span class="m" style="flex:0 0 auto;justify-content:flex-end" title="累计 ${fmtFull(t.tokens.total)} tokens（入 ${fmtFull(t.tokens.input)} / 出 ${fmtFull(t.tokens.output)}）">🔥 <span class="m-text">${fmt(t.tokens.total)}</span></span>` : ''}
      </div>
    </div>`;
      }).join('');
      // bind click handlers
      area.querySelectorAll('.task-card').forEach((card, idx) => {
        const t = recent[idx];
        card.addEventListener('click', () => {
          if (window.pywebview && window.pywebview.api && t.workspacePath) {
            window.pywebview.api.openTask(t.workspacePath);
          }
        });
      });
      // show model badge from first task
      const first = recent[0];
      if (first && first.model) {
        const mb = document.getElementById('modelBadge');
        mb.textContent = (first.model || '').split('/').pop(); mb.style.display = '';
      }
    }

    function renderClock(now) { document.getElementById('clock').textContent = (now || '').slice(0, 8); }

    /* ---- helpers ---- */
    function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function relativeTime(ms) {
      if (!ms) return '-';
      const d = Date.now() - ms; const s = Math.floor(d / 1000);
      if (s < 5) return '刚刚';
      if (s < 60) return s + '秒前';
      if (s < 3600) return Math.floor(s / 60) + '分钟前';
      if (s < 86400) return Math.floor(s / 3600) + '小时前';
      return Math.floor(s / 86400) + '天前';
    }

    /* ---- theme 切换（localStorage 记忆，默认深色） ---- */
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      // 当前深色显示太阳（提示可切浅色），浅色显示月亮
      document.querySelector('.theme-btn .icon-moon').style.display = theme === 'dark' ? 'none' : 'block';
      document.querySelector('.theme-btn .icon-sun').style.display = theme === 'dark' ? 'block' : 'none';
      try { localStorage.setItem('zcodeWidgetTheme', theme); } catch (e) { /* 隐私模式等异常忽略 */ }
      // 主题令牌变化后 SVG 渐变 stop-color 由 CSS 变量驱动，无需手动重渲染
    }
    let _theme = 'dark';
    // 主题按钮已隐藏：固定深色，不再读取 localStorage，避免残留浅色记忆导致启动变浅色
    applyTheme(_theme);
    document.getElementById('themeBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* ---- 窗口透明度（滑块 30%-100%，步长 10，localStorage 记忆，桥 setOpacity） ---- */
    let _opacity = 100;
    try {
      const v = parseInt(localStorage.getItem('zcodeWidgetOpacity'), 10);
      if (v >= 30 && v <= 100) _opacity = v;
    } catch (e) { /* ignore */ }
    const opRange = document.getElementById('opRange');
    const opVal = document.getElementById('opVal');

    function applyOpacity(v) {
      _opacity = v;
      opRange.value = v;
      opVal.textContent = v + '%';
      // 滑块已填充段用 accent2 色（--op-fill 变量驱动渐变截止点）
      opRange.style.setProperty('--op-fill', v + '%');
      try { localStorage.setItem('zcodeWidgetOpacity', String(v)); } catch (e) { /* ignore */ }
      // 桥调用：窗口整体透明度。无桥（浏览器直开）时只更新 UI。
      if (window.pywebview && window.pywebview.api && window.pywebview.api.setOpacity) {
        window.pywebview.api.setOpacity(v / 100);
      }
    }
    // 拖动节流：input 高频触发，80ms 合并一次桥调用
    let _opTimer = null;
    opRange.addEventListener('input', () => {
      const v = parseInt(opRange.value, 10);
      opVal.textContent = v + '%';
      if (_opTimer) clearTimeout(_opTimer);
      _opTimer = setTimeout(() => applyOpacity(v), 80);
    });
    // 弹层开关：点按钮展开/收起；点弹窗内部不切换（滑块点击会冒泡到按钮）；
    // 点外部收起
    const opacityPop = document.getElementById('opacityPop');
    document.getElementById('opacityBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.target.closest('.opacity-pop')) return;
      opacityPop.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.opacity-btn')) opacityPop.classList.remove('open');
    });

    /* ---- events ---- */
    document.getElementById('closeBtn').addEventListener('click', () => { if (api && api.quit) api.quit(); });

    /* ---- collapse / expand toggle ---- */
    // Resizes the pywebview window between full size and a small Z icon.
    // On Windows, win.resize() keeps the top-left corner fixed, so the
    // widget just grows/shrinks in place — no position restore needed.
    let _collapsed = false;
    let _fullW = 322, _fullH = 850;   // full window size, synced from the live window
    const _ICON_W = 48, _ICON_H = 48; // collapsed icon size

    async function setCollapsed(collapsed) {
      _collapsed = collapsed;
      const hasApi = window.pywebview && window.pywebview.api;
      const apiObj = hasApi ? window.pywebview.api : null;

      // Before collapsing, remember the real full size so we can restore it.
      if (collapsed && apiObj && apiObj.getPos) {
        try {
          const p = await apiObj.getPos();
          if (p && typeof p.w === 'number' && typeof p.h === 'number') { _fullW = p.w; _fullH = p.h; }
        } catch (e) { /* bridge not ready; fall back to defaults */ }
      }

      document.getElementById('widget').classList.toggle('collapsed', collapsed);

      // Resize the native window to match (resize keeps the corner fixed on Win).
      if (apiObj && apiObj.resizeWindow) {
        try {
          await apiObj.resizeWindow(collapsed ? _ICON_W : _fullW, collapsed ? _ICON_H : _fullH);
        } catch (e) { console.error('resizeWindow failed:', e); /* non-fatal: UI still toggles */ }
      }
    }

    document.getElementById('collapseBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      setCollapsed(true);
    });
    // Expand is handled by the injected drag handler's mouseup (it distinguishes
    // a click from a drag via a movement threshold), so a click on the collapsed
    // Z icon expands while a drag moves the window.
    window.__toggleExpand = setCollapsed;

    /* ---- 8 方向自定义 resize（窗口 resizable=False，仿 header 拖拽模式） ---- */
    // 拖拽手柄时经 getPos()/moveWindow()/resizeWindow() 桥改原生窗口尺寸。
    // 与 header 拖拽的差异：
    // - 基准来自 getPos() 异步返回，返回前（ready=false）忽略 mousemove，防起点为 0 的跳变；
    // - 每帧从基准重算 w/h/x/y（不做增量累积），左/上边拖拽时 x/y 同步位移，
    //   保证右/下角不动；最小尺寸钳制后 x/y 按实际 w/h 反推，窗口不会"跑偏"；
    // - 桥调用加 _resizeLock 防堆积（mousemove 高频触发，桥每次调用都新建线程）。
    const _MIN_W = 240, _MIN_H = 300;  // 拖拽最小尺寸（折叠态 48x48 不受影响，手柄已隐藏）
    let _resizing = null;              // {dir, sx, sy, ready, wx, wy, ww, wh}
    let _resizeLock = false;

    document.querySelectorAll('.resize-handle').forEach(h => {
      h.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || !window.pywebview || !window.pywebview.api) return;
        e.preventDefault();
        e.stopPropagation();  // 与 header 拖拽互斥（手柄虽在 header 视觉范围内但不是其子元素）
        const apiObj = window.pywebview.api;
        _resizing = { dir: h.dataset.dir, sx: e.screenX, sy: e.screenY, ready: false, wx: 0, wy: 0, ww: 0, wh: 0 };
        apiObj.getPos().then(p => {
          if (_resizing) { _resizing.ready = true; _resizing.wx = p.x; _resizing.wy = p.y; _resizing.ww = p.w; _resizing.wh = p.h; }
        });
      });
    });

    document.addEventListener('mousemove', (e) => {
      const r = _resizing;
      if (!r || !r.ready || _resizeLock) return;
      const dx = e.screenX - r.sx, dy = e.screenY - r.sy;
      let w = r.ww, h = r.wh, x = r.wx, y = r.wy;
      if (r.dir.includes('e')) { w = Math.max(_MIN_W, r.ww + dx); }
      if (r.dir.includes('w')) { w = Math.max(_MIN_W, r.ww - dx); x = r.wx + (r.ww - w); }
      if (r.dir.includes('s')) { h = Math.max(_MIN_H, r.wh + dy); }
      if (r.dir.includes('n')) { h = Math.max(_MIN_H, r.wh - dy); y = r.wy + (r.wh - h); }
      _resizeLock = true;
      const apiObj = window.pywebview.api;
      Promise.resolve().then(() => {
        const calls = [];
        if (x !== r.wx || y !== r.wy) calls.push(apiObj.moveWindow(x, y));
        calls.push(apiObj.resizeWindow(w, h));
        return Promise.all(calls);
      }).catch(() => { /* 拖拽中失败忽略，下一帧继续 */ })
        .then(() => { _resizeLock = false; });
    });

    document.addEventListener('mouseup', () => { _resizing = null; });

    // clock tick independent of data refresh
    setInterval(() => { document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8); }, 1000);

    // Robust pywebview bootstrap. The bridge may become ready before or after this
    // script runs, so we listen for the event AND poll for a short window.
    function bindApi() {
      if (window.pywebview && window.pywebview.api) {
        api = window.pywebview.api;
        setInit('已连接，读取数据…');
        // 恢复记忆的透明度（桥就绪后才能真正应用到窗口）
        if (_opacity !== 100) applyOpacity(_opacity);
        startPolling();
        return true;
      }
      return false;
    }

    window.addEventListener('pywebviewready', () => {
      setInit('pywebview 已就绪');
      bindApi();
    });

    // Fallback polling in case the event already fired before our listener attached
    (function waitForApi(retries) {
      if (bindApi()) return;
      setInit('等待 pywebview 桥接… (' + (20 - retries) + '/20)');
      if (retries > 0) setTimeout(() => waitForApi(retries - 1), 300);
      else setInit('连接失败：pywebview 桥接未就绪');
    })(20);  // try for ~6s

    /* ---- boot：挂载 SVG 渐变数字（先于渲染函数，渲染时直接 g.set） ---- */
    const numObj = mount('#totalTokens', 'gnum-lg', 'g-base');
    const G = {
      inTokens: mount('#inTokens', 'gnum-md', 'g-in'),
      outTokens: mount('#outTokens', 'gnum-md', 'g-out'),
      todayTokens: mount('#todayTokens', 'gnum-sm', 'g-label'),
      weekTokens: mount('#weekTokens', 'gnum-sm', 'g-label'),
      allTokens: mount('#allTokens', 'gnum-sm', 'g-label'),
      dsBalance: mount('#dsBalance', 'gnum-bal', 'g-base'),
      ocTodayIn: mount('#ocTodayIn', 'gnum-md', 'g-in'),
      ocTodayOut: mount('#ocTodayOut', 'gnum-md', 'g-out'),
      ocWeek: mount('#ocWeek', 'gnum-md', 'g-base'),
      ocMonth: mount('#ocMonth', 'gnum-md', 'g-base'),
      dsTodayIn: mount('#dsTodayIn', 'gnum-md', 'g-in'),
      dsTodayOut: mount('#dsTodayOut', 'gnum-md', 'g-out'),
      dsWeek: mount('#dsWeek', 'gnum-md', 'g-base'),
      dsMonth: mount('#dsMonth', 'gnum-md', 'g-base'),
    };
    // 初始占位（隐藏 tab 里估算宽度，切换时 remeasure 修正）
    numObj.set('0');
    Object.keys(G).forEach(k => { if (G[k]) G[k].set('0'); });
  </script>
</body>
